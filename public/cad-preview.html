<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CAD 预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eef2f6; color: #172033; font-family: Arial, "Microsoft YaHei", sans-serif; }
    .viewer { display: grid; grid-template-rows: 52px minmax(0, 1fr); width: 100%; height: 100%; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid #d7dee8; background: #fff; }
    .title { min-width: 0; overflow: hidden; font-size: 15px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; flex: 0 0 auto; gap: 8px; }
    button { width: 38px; height: 34px; padding: 0; border: 1px solid #cbd4df; border-radius: 6px; background: #f7f9fb; color: #172033; font-size: 20px; cursor: pointer; }
    button[data-action="reset"] { width: auto; padding: 0 12px; font-size: 14px; }
    .stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: #fff; }
    .stage.dragging { cursor: grabbing; }
    .drawing { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: center; user-select: none; }
    .drawing svg { display: block; width: 100%; height: 100%; }
    .message { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px; color: #647086; text-align: center; }
    .message.error { color: #b42318; }
    .message[hidden], .drawing[hidden] { display: none; }
    .download-original { position: fixed; right: 16px; bottom: 18px; z-index: 20; min-height: 42px; padding: 0 18px; border-radius: 6px; background: #156f62; color: #fff; font-size: 15px; font-weight: 700; line-height: 42px; text-decoration: none; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18); }
    .download-original[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="viewer">
    <header class="toolbar">
      <div class="title">CAD 图纸预览</div>
      <div class="actions">
        <button type="button" data-action="zoom-out" aria-label="缩小">−</button>
        <button type="button" data-action="zoom-in" aria-label="放大">+</button>
        <button type="button" data-action="reset">适应窗口</button>
      </div>
    </header>
    <section class="stage">
      <div class="message">正在加载图纸...</div>
      <div class="drawing" role="img" aria-label="CAD 图纸" hidden></div>
    </section>
    <a class="download-original" href="#" hidden>下载原文件</a>
  </main>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const requestedSource = params.get("src") || "";
    const requestedDownload = params.get("download") || "";
    const requestedName = params.get("name") || "";
    const stage = document.querySelector(".stage");
    const drawing = document.querySelector(".drawing");
    const message = document.querySelector(".message");
    const downloadButton = document.querySelector(".download-original");
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let dragStart = null;

    function validSource(value) {
      try {
        const url = new URL(value, location.origin);
        return url.origin === location.origin && url.pathname.startsWith("/uploads/previews/") ? url.href : "";
      } catch {
        return "";
      }
    }

    function validDownload(value) {
      try {
        const url = new URL(value, location.origin);
        const extension = url.pathname.split(".").pop().toLowerCase();
        return url.origin === location.origin && url.pathname.startsWith("/uploads/drawings/") && ["dwg", "dxf"].includes(extension) ? url : null;
      } catch {
        return null;
      }
    }

    function safeFileName(value, downloadUrl) {
      const fallback = decodeURIComponent(downloadUrl.pathname.split("/").pop() || "drawing.dwg");
      return String(value || fallback).replace(/[\\/:*?"<>|]/g, "_").trim() || fallback;
    }

    function setupDownload() {
      const downloadUrl = validDownload(requestedDownload);
      if (!downloadUrl) return;
      const fileName = safeFileName(requestedName, downloadUrl);
      downloadButton.href = downloadUrl.href;
      downloadButton.download = fileName;
      downloadButton.hidden = false;
      downloadButton.addEventListener("click", (event) => {
        if (!window.wx || !wx.miniProgram || typeof wx.miniProgram.navigateTo !== "function") return;
        event.preventDefault();
        const pageUrl = `/pages/file-download/file-download?url=${encodeURIComponent(downloadUrl.href)}&name=${encodeURIComponent(fileName)}`;
        wx.miniProgram.navigateTo({ url: pageUrl });
      });
    }

    function renderTransform() {
      drawing.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }

    function resetView() {
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      renderTransform();
    }

    function zoom(delta) {
      scale = Math.min(12, Math.max(0.5, scale * delta));
      renderTransform();
    }

    function fitSvgToContent(svg) {
      const bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
      const shapes = svg.querySelectorAll("line,path,polyline,polygon,circle,ellipse,text,tspan");
      shapes.forEach((shape) => {
        if (shape.closest("defs")) return;
        try {
          const box = shape.getBBox();
          if (box.width === 0 && box.height === 0) return;
          bounds.minX = Math.min(bounds.minX, box.x);
          bounds.minY = Math.min(bounds.minY, box.y);
          bounds.maxX = Math.max(bounds.maxX, box.x + box.width);
          bounds.maxY = Math.max(bounds.maxY, box.y + box.height);
        } catch {}
      });
      if (!Number.isFinite(bounds.minX)) return;
      const width = Math.max(1, bounds.maxX - bounds.minX);
      const height = Math.max(1, bounds.maxY - bounds.minY);
      const padding = Math.max(2, Math.max(width, height) * 0.025);
      svg.setAttribute("viewBox", `${bounds.minX - padding} ${bounds.minY - padding} ${width + padding * 2} ${height + padding * 2}`);
      svg.removeAttribute("width");
      svg.removeAttribute("height");
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    }

    async function loadDrawing(source) {
      const response = await fetch(source, { credentials: "same-origin" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const documentNode = new DOMParser().parseFromString(await response.text(), "image/svg+xml");
      const svg = documentNode.documentElement;
      if (svg.nodeName.toLowerCase() !== "svg" || documentNode.querySelector("parsererror")) throw new Error("SVG 格式无效");
      svg.querySelectorAll("script,foreignObject").forEach((node) => node.remove());
      drawing.replaceChildren(document.importNode(svg, true));
      drawing.hidden = false;
      fitSvgToContent(drawing.querySelector("svg"));
      message.hidden = true;
      resetView();
    }

    document.querySelector("[data-action=\"zoom-in\"]").addEventListener("click", () => zoom(1.35));
    document.querySelector("[data-action=\"zoom-out\"]").addEventListener("click", () => zoom(1 / 1.35));
    document.querySelector("[data-action=\"reset\"]").addEventListener("click", resetView);

    stage.addEventListener("pointerdown", (event) => {
      dragStart = { x: event.clientX - offsetX, y: event.clientY - offsetY };
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);
    });
    stage.addEventListener("pointermove", (event) => {
      if (!dragStart) return;
      offsetX = event.clientX - dragStart.x;
      offsetY = event.clientY - dragStart.y;
      renderTransform();
    });
    stage.addEventListener("pointerup", () => {
      dragStart = null;
      stage.classList.remove("dragging");
    });
    stage.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoom(event.deltaY < 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });

    const source = validSource(requestedSource);
    setupDownload();
    if (!source) {
      message.textContent = "CAD 预览地址无效";
      message.classList.add("error");
    } else {
      loadDrawing(source).catch(() => {
        message.textContent = "CAD 图纸加载失败，请重新生成预览";
        message.classList.add("error");
      });
    }
  </script>
</body>
</html>
