plugins {
    id "com.android.application"
}

android {
    namespace "com.bobogd.tv"
    compileSdk 35

    defaultConfig {
        applicationId "com.bobogd.tv"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    packagingOptions {
        exclude "lib/x86/**"
        exclude "lib/x86_64/**"
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:128.0.20240725162350"
}
